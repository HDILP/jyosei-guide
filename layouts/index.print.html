<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>{{ .Site.Title }} - 完整打印版</title>
  
  <!-- ✅ 修复：添加 targetPath 参数 -->
  {{ $css := resources.Get "book.scss" | resources.ExecuteAsTemplate "css/book.print.css" . | resources.ToCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">

  <style>
    /* 打印专用样式 */
    @media print {
      .book-menu, .book-header, .book-search, .book-toc {
        display: none !important;
      }
      
      .book-content {
        margin: 0 !important;
        max-width: 100% !important;
        flex: none !important;
      }

      .print-section {
        page-break-after: always;
        margin-bottom: 2rem;
      }
      
      pre, code, .book-hint, .book-tabs {
        page-break-inside: avoid;
        white-space: pre-wrap;
      }
      
      a {
        text-decoration: none;
        color: #000;
      }
    }
  </style>
</head>
<body>
  <div class="book">
    <main class="book-content">
      <header class="print-section">
        <h1>{{ .Site.Title }}</h1>
        <p>{{ .Site.Params.description }}</p>
        <p>生成时间: {{ now.Format "2006-01-02" }}</p>
      </header>

      {{ range .Site.RegularPages.ByWeight }}
        <article class="print-section">
          <h1>{{ .Title }}</h1>
          {{ .Content }}
        </article>
      {{ end }}
    </main>
  </div>
</body>
</html>
