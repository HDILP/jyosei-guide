<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <title>{{ .Site.Title }} - 完整打印版</title>
  
  <!-- 样式处理：执行模板变量并编译 SCSS -->
  {{ $css := resources.Get "book.scss" | resources.ExecuteAsTemplate "css/book.print.css" . | resources.ToCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">

  <style>
    /* 打印专用样式优化 */
    @media print {
      /* 隐藏导航元素 */
      .book-menu, .book-header, .book-search, .book-toc {
        display: none !important;
      }
      
      /* 内容区域占满全宽 */
      .book-content {
        margin: 0 !important;
        max-width: 100% !important;
        flex: none !important;
      }

      /* 分页控制 */
      .print-section {
        page-break-after: always;
        margin-bottom: 2rem;
      }
      
      /* 防止代码块/提示框被截断 */
      pre, code, .book-hint, .book-tabs {
        page-break-inside: avoid;
        white-space: pre-wrap;
      }
      
      /* 强制显示被折叠的内容 (Tabs/Hints) */
      .book-tabs-content, .book-hint {
        display: block !important;
        visibility: visible !important;
      }
      
      a {
        text-decoration: none;
        color: #000;
      }
    }
  </style>
</head>
<body>
  <div class="book">
    <main class="book-content">
      <!-- 封面 -->
      <header class="print-section">
        <h1>{{ .Site.Title }}</h1>
        <p>{{ .Site.Params.description }}</p>
        <p>生成时间: {{ now.Format "2006-01-02" }}</p>
      </header>

      <!-- ✅ 关键修复：使用 .ByWeight 替代 sort 函数 -->
      <!-- .Site.RegularPages 自动递归所有子目录，.ByWeight 按权重排序 -->
      {{ range .Site.RegularPages.ByWeight }}
        <article class="print-section">
          <h1>{{ .Title }}</h1>
          {{ .Content }}
        </article>
      {{ end }}
    </main>
  </div>
</body>
</html>
